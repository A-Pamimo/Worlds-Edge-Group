[project]
name = "weg"
version = "0.1.0"
description = "World's Edge Group trade-report platform: reproducible monthly Canada-Asia trade issues"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "statsmodels>=0.14",
    "lxml>=6.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weg"]

[tool.uv]
dev-dependencies = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
